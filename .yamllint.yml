extends: default

ignore: |
  .terraform/
  ansible/collections/

rules:
  line-length:
    max: 160
    level: warning
  truthy:
    allowed-values: ["true", "false", "yes", "no", "on"]
    check-keys: false
  comments:
    min-spaces-from-content: 1
  comments-indentation: false
  braces:
    max-spaces-inside: 1
  document-start: disable
  octal-values:
    forbid-implicit-octal: true
    forbid-explicit-octal: true
