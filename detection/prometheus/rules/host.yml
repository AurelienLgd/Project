# Host health alerts, fed by node_exporter (job="node").
# Every target carries a `host` label set at scrape time (see prometheus.yml).
groups:
  - name: vigie-host
    rules:
      - alert: HostDown
        expr: up{job="node"} == 0
        for: 2m
        labels:
          severity: critical
          category: infra
        annotations:
          summary: "Host {{ $labels.host }} is unreachable"
          description: "node_exporter on {{ $labels.host }} ({{ $labels.instance }}) has not answered scrapes for 2 minutes."
          runbook_url: "https://github.com/aurelienlgd/project/blob/main/docs/runbooks.md#hostdown"

      - alert: HostHighCpuLoad
        expr: 100 * (1 - avg by (host) (rate(node_cpu_seconds_total{mode="idle"}[5m]))) > 90
        for: 10m
        labels:
          severity: warning
          category: infra
        annotations:
          summary: "CPU usage above 90% on {{ $labels.host }}"
          description: "CPU usage has been {{ $value | printf \"%.0f\" }}% for 10 minutes. Unexpected sustained load can also indicate cryptomining."
          runbook_url: "https://github.com/aurelienlgd/project/blob/main/docs/runbooks.md#hosthighcpuload"

      - alert: HostOutOfMemory
        expr: node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes < 0.10
        for: 5m
        labels:
          severity: warning
          category: infra
        annotations:
          summary: "Less than 10% memory available on {{ $labels.host }}"
          description: "Only {{ $value | humanizePercentage }} of memory is available."
          runbook_url: "https://github.com/aurelienlgd/project/blob/main/docs/runbooks.md#hostoutofmemory"

      - alert: HostOomKillDetected
        expr: increase(node_vmstat_oom_kill[5m]) > 0
        labels:
          severity: warning
          category: infra
        annotations:
          summary: "OOM killer invoked on {{ $labels.host }}"
          description: "The kernel killed {{ $value | printf \"%.0f\" }} process(es) for lack of memory in the last 5 minutes."
          runbook_url: "https://github.com/aurelienlgd/project/blob/main/docs/runbooks.md#hostoomkilldetected"

      - alert: HostDiskAlmostFull
        expr: |
          (
            node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs|nsfs|ramfs"}
            / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs|nsfs|ramfs"}
          ) < 0.10
          and on (instance, device, mountpoint) node_filesystem_readonly == 0
        for: 5m
        labels:
          severity: critical
          category: infra
        annotations:
          summary: "Filesystem {{ $labels.mountpoint }} almost full on {{ $labels.host }}"
          description: "Only {{ $value | humanizePercentage }} space left on {{ $labels.device }}. A full /var/log silently stops security logging."
          runbook_url: "https://github.com/aurelienlgd/project/blob/main/docs/runbooks.md#hostdiskalmostfull"

      - alert: HostDiskWillFillIn24Hours
        expr: |
          (
            node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs|nsfs|ramfs"}
            / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs|nsfs|ramfs"}
          ) < 0.25
          and predict_linear(node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs|nsfs|ramfs"}[6h], 24 * 3600) < 0
          and on (instance, device, mountpoint) node_filesystem_readonly == 0
        for: 30m
        labels:
          severity: warning
          category: infra
        annotations:
          summary: "Filesystem {{ $labels.mountpoint }} on {{ $labels.host }} will fill within 24h"
          description: "At the current write rate, {{ $labels.device }} will run out of space within 24 hours."
          runbook_url: "https://github.com/aurelienlgd/project/blob/main/docs/runbooks.md#hostdiskwillfillin24hours"

      - alert: HostSystemdUnitFailed
        expr: node_systemd_unit_state{state="failed"} == 1
        for: 5m
        labels:
          severity: warning
          category: infra
        annotations:
          summary: "systemd unit {{ $labels.name }} failed on {{ $labels.host }}"
          description: "Unit {{ $labels.name }} has been in the failed state for 5 minutes."
          runbook_url: "https://github.com/aurelienlgd/project/blob/main/docs/runbooks.md#hostsystemdunitfailed"

      - alert: HostClockNotSynchronised
        expr: min_over_time(node_timex_sync_status[5m]) == 0 and node_timex_maxerror_seconds >= 16
        for: 10m
        labels:
          severity: warning
          category: infra
        annotations:
          summary: "Clock not synchronised on {{ $labels.host }}"
          description: "NTP synchronisation is lost. Drifting clocks break log correlation, TLS and Kerberos."
          runbook_url: "https://github.com/aurelienlgd/project/blob/main/docs/runbooks.md#hostclocknotsynchronised"

      - alert: HostRebooted
        expr: time() - node_boot_time_seconds < 600
        labels:
          severity: info
          category: infra
        annotations:
          summary: "{{ $labels.host }} rebooted less than 10 minutes ago"
          description: "Check that the reboot was planned (patching window) and that every service came back."
          runbook_url: "https://github.com/aurelienlgd/project/blob/main/docs/runbooks.md#hostrebooted"
